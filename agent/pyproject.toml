[project]
name = "querivue-agent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Kushagar Sharma", email = "kushagars08@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["pydantic==2.14.4"]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not redis'"
markers = [
    "live: requires live provider services",
    "redis: requires a Redis service",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
