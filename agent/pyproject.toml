[project]
name = "querivue-agent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Kushagar Sharma", email = "kushagars08@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain==1.5.2",
    "langchain-core==1.8.4",
    "langgraph==1.2.24",
    "langgraph-checkpoint-redis==0.6.0",
    "pydantic==2.14.4",
    "redis==8.1.0",
    "rfc8785==0.1.4",
    "duckdb==1.0.0",
    "sqlglot==25.7.0",
    "pyarrow==16.0.0",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not redis'"
markers = [
    "live: requires live provider services",
    "redis: requires a Redis service",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
data = { data = "config" }
